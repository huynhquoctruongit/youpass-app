name: Next.js AI Line Reviewer (OpenRouter)

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: AI Code Review từng dòng
        uses: stefanprodan/openai-pr-reviewer@v1
        with:
          # Giữ nguyên Token tự động của GitHub để tạo comment
          github_token: ${{ secrets.GITHUB_TOKEN }}
          
          # Đổi sang dùng Key OpenRouter bạn vừa tạo ở Bước 1
          openai_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          
          # ĐƯỜNG DẪN BẮT BUỘC: Ép script gọi qua cổng OpenRouter thay vì OpenAI mặc định
          openai_api_base: "https://openrouter.ai/api/v1"
          
          # CHỌN MODEL: Điền chính xác ID model của OpenRouter tại đây
          # Ví dụ dưới đây dùng Claude 3.5 Sonnet (mô hình review code đỉnh nhất hiện tại)
          openai_api_model: "anthropic/claude-3.5-sonnet"
          
          # Cấu hình ngôn ngữ và luật cho AI
          review_comment_language: "Vietnamese"
          system_message: |
            Bạn là một Chuyên gia Đánh giá Mã nguồn (Senior Code Reviewer) cực kỳ khắt khe về Next.js và React.
            Hãy duyệt qua các dòng code thay đổi trong PR này.
            CHỈ tạo comment vào ĐÚNG dòng code nào vi phạm tiêu chuẩn nghiêm trọng (ví dụ: dùng thẻ <img> thay vì <Image> của Next.js, lỗi logic, viết code rườm rà dễ crash).
            Nếu dòng code đó đã ổn, TUYỆT ĐỐI KHÔNG comment lung tung để tránh làm loãng Pull Request.