name: Auto Resolve and Check Comments

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Kích hoạt khi bạn hoặc CodeRabbit gõ bình luận mới
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write # Cần quyền write để script tự bấm Resolve thay bạn
  contents: read

jobs:
  check-threads:
    runs-on: ubuntu-latest
    steps:
      - name: Auto Resolve by Keyword and Verify Threads
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request ? context.payload.pull_request.number : context.issue.number;

            if (!pull_number) return;

            // 1. LẤY TOÀN BỘ CÁC THREAD THẢO LUẬN QUẢ GRAPHQL
            const query = `
              query($owner: String!, $repo: String!, $pull_number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pull_number) {
                    reviewThreads(first: 100) {
                      nodes {
                        id
                        isResolved
                        isOutdated
                        comments(last: 1) {
                          nodes {
                            body
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;
            
            const result = await github.graphql(query, { owner, repo, pull_number });
            const threadsList = result.repository.pullRequest.reviewThreads.nodes;

            let unresolvedCount = 0;

            // 2. DUYỆT TỪNG THREAD
            for (const thread of threadsList) {
              if (thread.isOutdated) continue; // Bỏ qua nếu là Outdated

              if (!thread.isResolved) {
                const lastComment = thread.comments.nodes[0]?.body?.trim()?.toLowerCase();
                
                // Nếu bạn gõ "r", "done" hoặc "resolved" vào ô reply của thread đó
                if (lastComment === 'r' || lastComment === 'done' || lastComment === 'resolved') {
                  // Script sẽ tự gọi API bấm "Resolve conversation" thay cho bạn luôn!
                  const resolveMutation = `
                    mutation($threadId: ID!) {
                      resolveReviewThread(input: { threadId: $threadId }) {
                        thread { id isResolved }
                      }
                    }
                  `;
                  await github.graphql(resolveMutation, { threadId: thread.id });
                  console.log(`Đã tự động Resolve thread: ${thread.id}`);
                } else {
                  unresolvedCount++;
                }
              }
            }

            // 3. ĐƯA RA KẾT QUẢ CHO BUTTON MERGE
            if (unresolvedCount > 0) {
              core.setFailed(`Xảy ra lỗi: Vẫn còn ${unresolvedCount} cuộc hội thoại chưa xử lý xong.`);
            } else {
              console.log("Tất cả ok! Nút merge sẽ sáng lên.");
            }