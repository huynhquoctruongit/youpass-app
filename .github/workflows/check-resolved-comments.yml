name: Check Resolved Conversations

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Đảm bảo bắt trọn khoảnh khắc bạn bấm nút Resolve hoặc Unresolve trên giao diện Web
  pull_request_review_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited, deleted]

# Gom tất cả các luồng trùng lặp tránh việc chạy đua (race condition)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  contents: read

jobs:
  check-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Verify All Conversations Are Resolved
        uses: edisongustavo/unresolved-conversations-action@v1.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}