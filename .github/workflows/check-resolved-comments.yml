name: Check Resolved Conversations

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  # Kích hoạt chạy lại ngay khi CodeRabbit kết thúc lượt review và submit
  pull_request_review:
    types: [submitted]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read
  checks: read

jobs:
  check-threads:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and Auto Resolve Threads
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request ? context.payload.pull_request.number : context.issue.number;

            if (!pull_number) return;

            // 1. KIỂM TRA TRẠNG THÁI CODERABBIT
            const { data: checks } = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha,
            });

            const codeRabbitCheck = checks.check_runs.find(run => run.name.toLowerCase().includes('coderabbit'));
            
            // Nếu phát hiện CodeRabbit đang "Review in progress" giống trong ảnh, script sẽ chủ động báo lỗi (đỏ) luôn để chặn nút merge lại
            if (codeRabbitCheck && codeRabbitCheck.status !== 'completed') {
              core.setFailed("Đợi chút! CodeRabbit đang tiến hành review code, vui lòng đợi hệ thống chạy xong.");
              return;
            }

            // 2. NẾU CODERABBIT XONG RỒI -> QUÉT COMMENT NHƯ BÌNH THƯỜNG
            const query = `
              query($owner: String!, $repo: String!, $pull_number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pull_number) {
                    reviewThreads(first: 100) {
                      nodes {
                        id
                        isResolved
                        isOutdated
                        comments(last: 1) {
                          nodes {
                            body
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;
            
            const result = await github.graphql(query, { owner, repo, pull_number });
            const threadsList = result.repository.pullRequest.reviewThreads.nodes;

            let unresolvedCount = 0;

            for (const thread of threadsList) {
              if (thread.isOutdated) continue;

              if (!thread.isResolved) {
                const lastComment = thread.comments.nodes[0]?.body?.trim()?.toLowerCase();
                
                if (lastComment === 'r' || lastComment === 'done' || lastComment === 'resolved') {
                  const resolveMutation = `
                    mutation($threadId: ID!) {
                      resolveReviewThread(input: { threadId: $threadId }) {
                        thread { id isResolved }
                      }
                    }
                  `;
                  await github.graphql(resolveMutation, { threadId: thread.id });
                } else {
                  unresolvedCount++;
                }
              }
            }

            if (unresolvedCount > 0) {
              core.setFailed(`Xảy ra lỗi: Vẫn còn ${unresolvedCount} cuộc hội thoại chưa được Resolve!`);
            } else {
              console.log("Hợp lệ! Tất cả cuộc hội thoại đã được xử lý.");
            }