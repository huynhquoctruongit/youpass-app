name: Check Resolved Conversations

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Kích hoạt chạy lại ngay khi bạn bấm nút Resolve hoặc Unresolve trên giao diện Web
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]

# Gom nhóm các luồng chạy trùng nhau để không bao giờ bị kẹt lại check cũ
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  contents: read

jobs:
  check-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Check for unresolved threads
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request ? context.payload.pull_request.number : context.issue.number;

            if (!pull_number) {
              console.log("Không tìm thấy số Pull Request.");
              return;
            }

            const query = `
              query($owner: String!, $repo: String!, $pull_number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pull_number) {
                    reviewThreads(first: 100) {
                      nodes {
                        isResolved
                      }
                    }
                  }
                }
              }
            `;
            
            const variables = { owner, repo, pull_number };
            const result = await github.graphql(query, variables);
            const threadsList = result.repository.pullRequest.reviewThreads.nodes;
            
            const unresolvedThreads = threadsList.filter(thread => !thread.isResolved);

            if (unresolvedThreads.length > 0) {
              core.setFailed(`Xảy ra lỗi: Vẫn còn ${unresolvedThreads.length} cuộc hội thoại chưa được Resolve!`);
            } else {
              console.log("Tuyệt vời! Tất cả các comment đã được Resolve.");
            }