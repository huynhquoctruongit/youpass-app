name: Next.js AI Line Reviewer (OpenRouter)

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Code Review từng dòng bằng OpenRouter
        uses: Codium-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # 1. ĐỔI TÊN BIẾN: pr-agent bắt buộc viết là OPENAI_KEY (bỏ chữ _API đi)
          OPENAI_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI.API_BASE: "https://openrouter.ai/api/v1"
          
          # 2. CHỌN MODEL CHUẨN
          CONFIG.MODEL: "deepseek/deepseek-chat"
          
          # 3. ÉP CHẠY LẠI KHI PUSH CODE MỚI: Mở khóa tính năng chặn "synchronize" ban nãy
          PR_REVIEWER.GIVE_REVIEW_COMMENTS: true
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: true
          
          # Cấu hình ngôn ngữ tiếng Việt
          PR_REVIEWER.LANGUAGE: "Vietnamese"
          PR_REVIEWER.EXTRA_INSTRUCTIONS: |
            Bạn là một Chuyên gia Đánh giá Mã nguồn (Senior Developer) về Next.js và React.
            Hãy duyệt qua các dòng code thay đổi trong PR này.
            CHỈ tạo comment vào ĐÚNG dòng code nào vi phạm tiêu chuẩn nghiêm trọng (ví dụ: dùng thẻ <img> thay vì <Image> của Next.js, lỗi logic, viết code rườm rà dễ crash).
            Nhận xét ngắn gọn, trực diện bằng tiếng Việt.