name: Next.js AI Line Reviewer (OpenRouter Paid)

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Code Review từng dòng bằng OpenRouter Paid
        uses: Codium-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI.API_BASE: "https://openrouter.ai/api/v1"
          
          # Sử dụng ông vua review code để nhận diện đúng cấu trúc file code
          CONFIG.MODEL: "anthropic/claude-3.5-sonnet"
          
          # ==========================================================
          # 🚨 CẤU HÌNH QUAN TRỌNG: ÉP AI BẮN COMMENT TRỰC TIẾP VÀO FILE
          # ==========================================================
          PR_REVIEWER.GIVE_REVIEW_COMMENTS: true        # Bật tính năng nhận xét từng dòng
          PR_REVIEWER.INLINE_COMMENTS: true             # Ép găm comment vào tab "Files changed"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: true        # Tự động quét khi phát hiện PR
          PR_REVIEWER.PERSISTENT_COMMENT: true          # Giữ lại các nhận xét cũ nếu code chưa sửa
          PR_REVIEWER.ENABLE_INTRO_COMMENT: false       # Tắt bớt comment chào hỏi dài dòng ở tab ngoài
          
          PR_REVIEWER.LANGUAGE: "Vietnamese"
          
          # BỘ QUY TẮC PHÂN TÍCH CHUYÊN SÂU
          PR_REVIEWER.EXTRA_INSTRUCTIONS: |
            Bạn là một Chuyên gia Đánh giá Mã nguồn (Principal Engineer / Security Auditor) kỳ cựu chuyên trị Next.js, React, và TypeScript.
            Nhiệm vụ của bạn là duyệt qua các dòng code thay đổi trong PR này và CHỈ tạo bình luận (Inline Comment) trực tiếp vào những dòng vi phạm nghiêm trọng các tiêu chí sau:

            1. TIÊU CHUẨN SẮP XẾP IMPORT ĐẸP CODE (Import Sorting & Cleanliness):
               - Kiểm tra khối import đầu file. Bắt lỗi nếu lộn xộn.
               - Yêu cầu cấu trúc nhóm Import:
                 + Nhóm 1: Thư viện ngoài (react, expo-router, react-native...).
                 + Nhóm 2: Các component/hooks nội bộ dùng alias (@/, @hooks/, @contexts/...).
                 + Nhóm 3: Các đường dẫn tương đối (../, ./).
               - ĐẶC BIỆT: Gom các dòng "Import Name" ({ ... }) nằm chung với nhau và các dòng "Import Default" hoặc "Import *" nằm chung với nhau trong cùng một nhóm để code sạch đẹp.

            2. CÚ PHÁP & TỐI ƯU LUỒNG (Flow & Syntax):
               - Kiểm tra các luồng bất đồng bộ (async/await), lồng mạch logic phức tạp, hoặc thiếu try/catch dễ crash ứng dụng.

            3. RÒ RỈ BỘ NHỚ (Memory Leaks) & HIỆU NĂNG:
               - Quét kỹ useEffect, useMemo, useCallback. Bắt buộc phải có Cleanup Function khi đăng ký Event Listener, Subscription, setInterval/setTimeout.
               - Phát hiện việc thiếu Dependency Array hoặc truyền thừa biến gây re-render vô hạn.

            4. BẢO MẬT (Security) & BEST PRACTICES:
               - Phát hiện rò rỉ token, API Key hoặc lộ biến môi trường bí mật (lỗi dùng nhầm NEXT_PUBLIC_).

            YÊU CẦU VỀ COMMENT:
            - Văn phong: Khắt khe, đi thẳng vào vấn đề.
            - Nội dung: Chỉ rõ dòng code đang gặp lỗi gì, giải thích tại sao nguy hiểm và đưa ra đoạn code sửa mẫu (Refactor code) tối ưu hơn ngay trong comment đó.
            - Nếu đoạn code không vi phạm lỗi nghiêm trọng nào ở trên, TUYỆT ĐỐI KHÔNG để lại bình luận để tránh làm loãng PR.