name: Check Resolved Conversations

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  contents: read

jobs:
  check-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Check for active unresolved threads
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request ? context.payload.pull_request.number : context.issue.number;

            if (!pull_number) {
              console.log("Không tìm thấy số Pull Request.");
              return;
            }

            // Sử dụng GraphQL để lấy cả trạng thái 'isResolved' và trạng thái 'isOutdated' của từng thread
            const query = `
              query($owner: String!, $repo: String!, $pull_number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pull_number) {
                    reviewThreads(first: 100) {
                      nodes {
                        isResolved
                        isOutdated
                        comments(first: 1) {
                          nodes {
                            body
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;
            
            const variables = { owner, repo, pull_number };
            const result = await github.graphql(query, variables);
            const threadsList = result.repository.pullRequest.reviewThreads.nodes;
            
            // ĐIỀU KIỆN MỚI: Chỉ giữ lại những comment CHƯA RESOLVE "VÀ" CHƯA BỊ OUTDATED
            const activeUnresolvedThreads = threadsList.filter(thread => !thread.isResolved && !thread.isOutdated);

            if (activeUnresolvedThreads.length > 0) {
              core.setFailed(`Xảy ra lỗi: Vẫn còn ${activeUnresolvedThreads.length} cuộc hội thoại đang hoạt động chưa được xử lý!`);
            } else {
              console.log("Tuyệt vời! Tất cả các comment cần xử lý đã được Resolve hoặc đã Outdated.");
            }