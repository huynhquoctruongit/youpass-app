name: Next.js AI Line Reviewer (Direct Inline)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ghim thẳng comment công khai vào từng dòng code
        uses: anc95/ChatGPT-CodeReview@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # Đấu nối tài khoản OpenRouter Paid của bạn
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_BASE: "https://openrouter.ai/api/v1"
          
          # Gọi siêu mẫu Claude 3.5 Sonnet quét luồng & import
          MODEL: "anthropic/claude-3.5-sonnet"
          
          LANGUAGE: "Vietnamese"
          PROMPT: |
            Bạn là một Principal Engineer chuyên trị Next.js, React và TypeScript.
            Hãy duyệt qua các dòng code thay đổi trong PR này (đặc biệt là phần import và useEffect).
            CHỈ tạo comment vào chính xác dòng code nào vi phạm các tiêu chí sau:
            1. Sắp xếp import lộn xộn: Gom các dòng "Import Name" ({ ... }) nằm chung với nhau và các dòng "Import Default" nằm chung với nhau theo từng nhóm (thư viện ngoài -> alias nội bộ @/ -> đường dẫn tương đối).
            2. Rò rỉ bộ nhớ (Memory Leaks): useEffect thiếu cleanup function khi đăng ký sự kiện hoặc loop.
            3. Bảo mật: Lộ biến môi trường bí mật hoặc xử lý logic lỏng lẻo.
            
            Nếu dòng code vi phạm, hãy đưa ra nhận xét khắt khe, giải thích lý do nguy hiểm và cung cấp đoạn code refactor mẫu ngay trong bình luận. Không khen ngợi dạo.